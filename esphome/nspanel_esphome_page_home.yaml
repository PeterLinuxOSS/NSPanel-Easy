#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME Page Home                                                                         #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################

---
substitutions:
  ##############################
  ## Change only in your      ##
  ## local yaml substitutions ##
  TAG_PAGE_HOME: nspanel.page.home
  SUN_DEFAULT_LATITUDE: '0'
  SUN_DEFAULT_LONGITUDE: '0'
  ##############################

esphome:
  build_flags:
    - -D NSPANEL_EASY_PAGE_HOME
    - -D NSPANEL_EASY_USE_WEATHER

globals:
  - id: is_climate
    type: bool
    restore_value: true
    initial_value: 'true'

  ##### Sun position #####
  - id: sun_latitude
    type: float
    restore_value: true
    initial_value: 'NAN'

  - id: sun_longitude
    type: float
    restore_value: true
    initial_value: 'NAN'

  ##### Date/time formats #####
  - id: home_date_color
    type: uint16_t
    restore_value: true
    initial_value: '65535'
  - id: home_time_color
    type: uint16_t
    restore_value: true
    initial_value: '65535'

  #### Custom buttons ####
  - id: home_custom_buttons_font_id
    type: uint8_t
    restore_value: true
    initial_value: '8'

script:
  - id: !extend action_component_color
    then:
      - lambda: |-
          if (display_easy) return;  // To do: Implement logic for new format
          if (page != "mem") return;
          if (component == "date_color") {
            id(home_date_color) = color;
            disp1->set_component_font_color(hmi::home::DATE.name, color);
            return;
          }
          if (component == "time_color") {
            id(home_time_color) = color;
            disp1->set_component_font_color(hmi::home::TIME.name, color);
            return;
          }

  - id: !extend action_component_text_list
    then:
      - lambda: |-
          if (page != "mem") return;
          if (component == "sun_coordinates") {
            // Latitude and longitude arrive together so they are always applied
            // as a pair, never half-updated.
            if (txt_list.size() != 2) {
              ESP_LOGE("${TAG_PAGE_HOME}", "Expected 2 sun coordinates, got %zu", txt_list.size());
              return;
            }
            const auto latitude = parse_number<float>(txt_list[0]);
            const auto longitude = parse_number<float>(txt_list[1]);
            id(sun_latitude) = latitude.has_value() ? *latitude : NAN;
            id(sun_longitude) = longitude.has_value() ? *longitude : NAN;
            sun_coordinates_apply->execute();
            return;
          }

  - id: !extend action_component_val
    then:
      - lambda: |-
          if (page != "mem") return;
          if (component == "is_climate") {
            id(is_climate) = (val != 0);
            return;
          }
          if (component == "custom_buttons_font") {
            // Custom buttons icon size
            id(home_custom_buttons_font_id) = static_cast<uint8_t>(val);
            for (int i = 1; i <= 7; ++i) {
              disp1->send_command_printf("home.button%02d.font=%" PRIu8, i, id(home_custom_buttons_font_id));
            }

            disp1->set_component_font(hmi::home::BT_NOTIFIC.name, id(home_custom_buttons_font_id));
            disp1->set_component_font(hmi::home::BT_QRCODE.name, id(home_custom_buttons_font_id));
            disp1->set_component_font(hmi::home::BT_ENTITIES.name, id(home_custom_buttons_font_id));
            blueprint_status_flags.page_home = true;
            return;
          }
          if (component == "outdoor_temp_font") {  // Outdoor temperature font size
            disp1->set_component_font(hmi::home::OUTDOOR_TEMP.name, static_cast<uint8_t>(val));
            return;
          }

  - id: !extend action_icon
    then:
      - lambda: |-
          if (!target_is_home_page) return;

          // Only applies to home page buttons (button01..button07) on new design
          if (!display_easy) return;
          if (!target_is_current_page) return;  // cirs only affects the visible page

          // Extract the numeric suffix from component_id, e.g. "button01" -> 1
          // Expected format: "button%02u" — prefix is exactly 6 chars ("button")
          constexpr uint8_t BUTTON_PREFIX_LEN = 6u;  // strlen("button")
          constexpr uint8_t BUTTON_COUNT      = 7u;

          if (component_id.length() != BUTTON_PREFIX_LEN + 2u ||
              component_id.substr(0u, BUTTON_PREFIX_LEN) != "button") {
            return;  // Not a home button component
          }

          // Parse the two-digit index; reject non-numeric suffixes
          const std::string suffix = component_id.substr(BUTTON_PREFIX_LEN);
          if (!std::isdigit(static_cast<unsigned char>(suffix[0])) ||
              !std::isdigit(static_cast<unsigned char>(suffix[1]))) {
            return;  // Not a valid button component
          }
          const uint8_t button_id = static_cast<uint8_t>(std::stoi(suffix));

          // Validate extracted index range [1..7]
          if (button_id < 1u || button_id > BUTTON_COUNT) {
            ESP_LOGW("${TAG_PAGE_HOME}", "Button id %" PRIu8 " out of range [1..%" PRIu8 "]",
                      button_id, BUTTON_COUNT);
            return;
          }

          // Only draw the circle when the blueprint has populated the icon
          if (icon.empty()) {
            ESP_LOGD("${TAG_PAGE_HOME}", "%s has no icon, skipping circle", component_id.c_str());
            return;
          }

          // Compute circle X-center: button01 -> 32, button02 -> 86, ... (+54 per step)
          const uint16_t circle_x      = 32u + static_cast<uint16_t>(button_id - 1u) * 54u;
          const uint16_t circle_y      = 257u;
          const uint16_t circle_radius = 22u;

          // Draw the filled circle behind the button, then trigger a repaint
          disp1->send_command_printf("cirs %" PRIu16 ",%" PRIu16 ",%" PRIu16 ",color_containers",
                                      circle_x, circle_y, circle_radius);

          disp1->send_command_printf("ref %s", component_id.c_str());

          ESP_LOGD("${TAG_PAGE_HOME}", "Drew circle for %s at (%" PRIu16 ",%" PRIu16 ")",
                    component_id.c_str(), circle_x, circle_y);

  - id: !extend boot_nextion
    then:
      - lambda: |-
          // Setup Home page
          boot_log->execute("Boot", "Set Home page elements");

          // Bluetooth icon
          #if defined(USE_ESP32_BLE_SERVER) || defined(USE_ESP32_BLE_CLIENT) || defined(USE_BLUETOOTH_PROXY)
          disp1->set_component_font(hmi::home::BT_ICON.name, id(chip_font_id));
          action_component_visibility->execute("home", "bt_icon", true);
          #endif

          // Custom buttons icon size
          for (uint8_t i = 1; i <= 7; ++i) {
            disp1->send_command_printf("home.button%02d.font=%i", i, id(home_custom_buttons_font_id));
          }

          // Other components icons size and color
          disp1->set_component_font(hmi::home::BT_ENTITIES.name, id(home_custom_buttons_font_id));
          disp1->set_component_font(hmi::home::WIFI_ICON.name,   id(chip_font_id));

  - id: !extend boot_wrap_up
    then:
      - script.execute: sun_coordinates_apply

  - id: !extend page_change
    then:
      - lambda: |-
          is_home_page = (new_page_id == get_page_id("home"));
          if (!is_home_page) return;
          page_home->execute();

  - id: page_home
    mode: single
    then:
      # Extended by:
      # - hw_relays
      # - hw_wifi
      - lambda: |-
          // Repaint home page custom buttons (only when using subscriptions)
          #ifdef NSPANEL_EASY_SUBSCRIBE
          home_button_repaint();
          #endif  // NSPANEL_EASY_SUBSCRIBE

  - id: !extend stop_all
    then:
      - lambda: |-
          page_home->stop();  // Page home is an exception to the stop_page_constructor, as it can be constructed in the background
          sun_coordinates_apply->stop();
          sun_state_update->stop();

  - id: sun_coordinates_apply
    mode: single
    then:
      - lambda: |-
          // coords_valid is derived here, never restored on its own, so it can
          // never disagree with the stored coordinates.
          sun_info.coords_valid = !std::isnan(id(sun_latitude)) && !std::isnan(id(sun_longitude));
          if (sun_info.coords_valid) {
            sun_component->set_latitude(id(sun_latitude));
            sun_component->set_longitude(id(sun_longitude));
          }
      - script.execute: sun_state_update

  - id: sun_state_update
    mode: single
    then:
      - lambda: |-
          if (sun_info.coords_valid) {
            // Seeded explicitly: SunTrigger suppresses its first crossing, so
            // the triggers alone would leave this stale until the next one.
            sun_info.is_up = sun_component->is_above_horizon();
          } else {
            const auto now = time_provider->now();
            if (!now.is_valid()) return;  // Keep the safe daytime default
            sun_info.is_up = (now.hour >= 6 && now.hour < 18);
          }
          #ifdef NSPANEL_EASY_SUBSCRIBE
          home_weather_resolve();
          #endif  // NSPANEL_EASY_SUBSCRIBE

sun:
  id: sun_component
  time_id: time_provider
  latitude: ${SUN_DEFAULT_LATITUDE}
  longitude: ${SUN_DEFAULT_LONGITUDE}
  on_sunrise:
    - then:
        - script.execute: sun_state_update
  on_sunset:
    - then:
        - script.execute: sun_state_update

time:
  - id: !extend time_provider
    on_time:
      - hours: 6,18
        minutes: 0
        seconds: 0
        then:
          - script.execute: sun_state_update
...
